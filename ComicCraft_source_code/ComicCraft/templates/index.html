<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft — AI Comic Creator</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main class="container">
    <section class="hero">
        <p class="eyebrow">AI COMIC STORY CREATOR</p>
        <h1>Turn your idea into a comic.</h1>
        <p>Describe your story, choose a character, mood and art style, then let ComicCraft build a five-panel comic.</p>
    </section>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form action="/generate" method="post" class="card">
        <label>Story Prompt</label>
        <textarea name="story_prompt" required placeholder="A brave fox discovers a mysterious door in an enchanted forest..."></textarea>

        <div class="grid">
            <div>
                <label>Main Character Name</label>
                <input name="character_name" required placeholder="Arun">
            </div>

            <div>
                <label>Setting</label>
                <select name="setting">
                    <option>Enchanted forest</option>
                    <option>School</option>
                    <option>Future city</option>
                    <option>Space</option>
                    <option>Village</option>
                    <option>Beach</option>
                </select>
            </div>

            <div>
                <label>Story Tone</label>
                <select name="tone">
                    <option>Funny</option>
                    <option>Light-hearted</option>
                    <option>Dramatic</option>
                    <option>Adventure</option>
                    <option>Poetic</option>
                    <option>Mysterious</option>
                </select>
            </div>

            <div>
                <label>Art Style</label>
                <select name="art_style">
                    <option>Comic book</option>
                    <option>Anime</option>
                    <option>Pixel art</option>
                    <option>Realistic</option>
                    <option>Cartoon</option>
                </select>
            </div>
        </div>

        <button type="submit">✨ Generate My Comic</button>
    </form>

    <p class="hint">Tip: image generation can take several minutes on a CPU.</p>
</main>
</body>
</html>
